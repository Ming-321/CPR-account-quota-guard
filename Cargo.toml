[package]
name = "account-quota-guard"
version = "0.1.3"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs", rev = "47d30474af7c3e1fab433f2d4a70430fae548ff2", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
rand = "0.9"
