[package]
name = "account-quota-guard"
version = "0.1.4"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs", rev = "5ae38dc0c55c192815ef605dde6c05fd767a2c28", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
rand = "0.9"
