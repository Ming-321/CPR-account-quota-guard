[package]
name = "account-quota-guard"
version = "0.1.2"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs", rev = "743a3aba70a4f78f27fb53d80a6e719599d2fe5e", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
rand = "0.9"
