[package]
name = "account-quota-guard"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs", rev = "f174320e2ac8987578146d4684e69ad196db0286", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
rand = "0.9"
